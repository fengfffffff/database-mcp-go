# database-mcp-go 主配置

server:
  port: 47319 # 服务端口

mcp:
  endpoint: /mcp # MCP 端点, 客户端连 http://127.0.0.1:47319/mcp
  auth_token: "" # Bearer Token, 留空不校验; 对外开放时填值
  session_timeout_seconds: 600 # 空闲会话超时秒数
  max_request_body_bytes: 0 # 请求体上限字节, 0 表示用 SDK 默认值
  disable_localhost_protection: false # 经隧道或反向代理访问时改为 true
  stateless: true # 会话模式: true 不维持会话, 每个请求独立; false 维持会话, 服务重启或空闲超时会让旧客户端失效

database:
  query_timeout_seconds: 30 # 单条语句超时秒数
  slow_query_threshold_ms: 1000 # 慢操作告警阈值毫秒
  max_rows: 1000 # 单次执行累计返回行数上限, 超出截断并标记 truncated

# 数据源存储方式: file 走独立的 JSON 文件, mysql 走配置表, 二选一
source:
  type: file
  file:
    path: datasources.json # JSON 文件路径, type=file 时生效
  mysql:
    # 切到 mysql 模式时填这三项, 真实密码与密钥不要提交到仓库
    dsn: "user:password@tcp(127.0.0.1:3306)/database_mcp?parseTime=true&loc=Asia/Shanghai"
    aes_key: "" # AES-256-GCM 密钥, base64 的 32 字节, 用 openssl rand -base64 32 生成
    table: sys_mcp_database_config

log:
  dir: logs
  level: info
  retain_days: 14 # 日志保留天数, 超期文件与空目录自动清理
  console: true
  sql: true # 是否记录执行的 SQL 语句, 默认开启, 内容截断到 500 字; 担心敏感数据落盘可设为 false

admin:
  username: "" # 管理页账号, 必填, 不能含冒号, 留空启动失败
  password: "" # 管理页密码, 必填, 留空启动失败
